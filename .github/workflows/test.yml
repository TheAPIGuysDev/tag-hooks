name: Test

# This repository's own gate. Consuming repos pin a SHA from here and run that
# code in their CI and on developer machines, so a regression escaping this
# workflow escapes into every consumer -- treat a red run as blocking.
#
# The golden corpus in tests/commit_message_cases.json is the drift detector:
# it pins BEHAVIOUR, not implementation, so a refactor that quietly changes
# what is accepted fails here rather than in someone else's repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q

  # Dogfood: this repository validates its own commit messages with its own
  # action, by local path. If the gate breaks, this repository notices first.
  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/commit-message-gate
